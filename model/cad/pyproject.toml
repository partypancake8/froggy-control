[project]
name = "froggy-cad"
version = "0.1.0"
description = "Headless build123d CAD toolchain for the Froggy Turntable (ROB 450 Team 03)"
requires-python = ">=3.12,<3.13"
dependencies = ["build123d>=0.13", "bd_warehouse>=0.3", "pyvista>=0.49", "trimesh>=5.1", "manifold3d>=3.5", "pillow"]

[project.scripts]
cad = "froggy_cad.cli:main"

[tool.setuptools]
packages = ["froggy_cad", "lib", "assemblies", "parts", "cadkit", "cadkit.idioms", "cadkit.viewer"]
# exact tested versions: requirements.txt
