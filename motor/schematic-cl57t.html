<text x="1520.0" y="1199.0" font-size="16" fill="#9198a1" text-anchor="start" font-weight="700">No hall sensor</text>

<text x="40.0" y="1412.0" font-size="14" fill="#9198a1" text-anchor="start" font-weight="400">STEPPERONLINE help article: CL57T-V41 closed loop wiring</text>
<text x="40.0" y="1430.0" font-size="14" fill="#9198a1" text-anchor="start" font-weight="400">(Controller = the Pi; solid wires = Variant A)</text>
<text x="390.0" y="1080.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Variant A is the vendor's own</text>
<text x="390.0" y="1099.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">diagram: GPIO straight to</text>
<text x="390.0" y="1118.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">PUL+, DIR+, ENA+; minus to GND.</text>
<text x="390.0" y="1137.0" font-size="14" fill="#f5c542" text-anchor="start" font-weight="700">S3 must be on 5V (p. 7).</text>
<text x="390.0" y="1156.0" font-size="14" fill="#ff5b5b" text-anchor="start" font-weight="600">Red LED must be OFF.</text>
<text x="390.0" y="1175.0" font-size="14" fill="#9198a1" text-anchor="start" font-weight="400">7 blinks = following error,</text>
<text x="390.0" y="1194.0" font-size="14" fill="#9198a1" text-anchor="start" font-weight="400">4 blinks = no motor.</text>
<text x="390.0" y="1213.0" font-size="14" fill="#9198a1" text-anchor="start" font-weight="400">Power-cycle to reset (p. 10, 11).</text>
<text x="390.0" y="1232.0" font-size="14" fill="#9198a1" text-anchor="start" font-weight="400">White ground symbols are all</text>
<text x="390.0" y="1251.0" font-size="14" fill="#9198a1" text-anchor="start" font-weight="400">the Pi GND net. Orange dashed</text>
<text x="390.0" y="1270.0" font-size="14" fill="#9198a1" text-anchor="start" font-weight="400">0 V goes to P4 GND only.</text>
<text x="40.0" y="1526.0" font-size="19" fill="#f5c542" text-anchor="start" font-weight="700">S1 rotary: code 0 (manual p. 6)</text>
<rect x="36" y="1536" width="382.6" height="367.5" rx="6" fill="#fff"/>
<image href="schematic-img/cl57t-s1-table.png" x="40.0" y="1540.0" width="374.6" height="359.5" preserveAspectRatio="none"/>
<rect x="40.0" y="1573.6" width="374.6" height="20.2" rx="6" fill="none" stroke="#f5c542" stroke-width="4"/>
<text x="40.0" y="1927.5" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="400">2.8 A peak / 2.0 A RMS = the motor's 2.0 A rating.</text>
<text x="40.0" y="1947.5" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="400">Never 4 to F on this motor.</text>
<text x="470.0" y="1526.0" font-size="19" fill="#f5c542" text-anchor="start" font-weight="700">SW1 to SW4: 3200 pulses/rev (p. 7)</text>
<rect x="466" y="1536" width="482.6" height="336.4" rx="6" fill="#fff"/>
<image href="schematic-img/cl57t-microstep-table.png" x="470.0" y="1540.0" width="474.6" height="328.4" preserveAspectRatio="none"/>
<rect x="470.0" y="1616.8" width="474.6" height="19.7" rx="6" fill="none" stroke="#f5c542" stroke-width="4"/>
<text x="470.0" y="1896.4" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="400">OFF OFF ON ON = microstep 16 in motor.toml.</text>
<text x="1000.0" y="1526.0" font-size="19" fill="#f5c542" text-anchor="start" font-weight="700">SW5 to SW8: all OFF (p. 7)</text>
<rect x="996" y="1536" width="566.4" height="129.6" rx="6" fill="#fff"/>
<image href="schematic-img/cl57t-mode-table.png" x="1000.0" y="1540.0" width="558.4" height="121.6" preserveAspectRatio="none"/>
<rect x="1372.8" y="1564.0" width="184.8" height="97.6" rx="6" fill="none" stroke="#f5c542" stroke-width="4"/>
<text x="1000.0" y="1689.6" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="400">SW5 OFF: direction is set in software (dir_cw_level).</text>
<text x="1000.0" y="1709.6" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="400">SW6 OFF: closed loop. SW7 OFF: PUL/DIR. SW8 OFF: 1.5 ms filter.</text>
<text x="1000.0" y="1745.6" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="400">S3 (top of the label above): slide to 5V. The factory setting is 24V,</text>
<text x="1000.0" y="1765.6" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="400">and 5 V signals do nothing until it is moved (p. 7).</text>
<path d="M 40 1966 H 1960" stroke="#30363d" stroke-width="2"/>
<text x="40.0" y="2010.0" font-size="30" fill="#e6edf3" text-anchor="start" font-weight="700">Check your work</text>
<rect x="40" y="2035" width="26" height="26" rx="4" fill="none" stroke="#e6edf3" stroke-width="3"/>
<text x="82.0" y="2056.0" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="700">1. S3 slid to 5V. S1 on 0. SW1..SW8 = OFF OFF ON ON OFF OFF OFF OFF.</text>
<text x="102.0" y="2080.0" font-size="16" fill="#9198a1" text-anchor="start" font-weight="400">Set with power off. Factory S3 is 24V and the motor will not move.</text>
<rect x="40" y="2099" width="26" height="26" rx="4" fill="none" stroke="#e6edf3" stroke-width="3"/>
<text x="82.0" y="2120.0" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="700">2. Variant A: PUL+ GPIO 18 (pin 12), DIR+ GPIO 17 (pin 11), ENA+ GPIO 27 (pin 13).</text>
<text x="102.0" y="2144.0" font-size="16" fill="#9198a1" text-anchor="start" font-weight="400">PUL−, DIR−, ENA− to Pi GND (pin 6). No FETs; Variant B only if pulses go missing.</text>
<rect x="40" y="2163" width="26" height="26" rx="4" fill="none" stroke="#e6edf3" stroke-width="3"/>
<text x="82.0" y="2184.0" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="700">3. ALM: 10 kΩ from 5 V (pin 4) and 15 kΩ to GND at the Pi end,</text>
<text x="102.0" y="2208.0" font-size="16" fill="#9198a1" text-anchor="start" font-weight="400">ALM wire to GPIO 22 (pin 15), COM− to GND (pin 14). The only added parts.</text>
<rect x="40" y="2227" width="26" height="26" rx="4" fill="none" stroke="#e6edf3" stroke-width="3"/>
<text x="82.0" y="2248.0" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="700">4. 24 V only on P4. Never plug P3 or P4 with power on.</text>
<text x="102.0" y="2272.0" font-size="16" fill="#9198a1" text-anchor="start" font-weight="400">ENA: GPIO 27 high = disabled. The driver holds the shaft from boot until the software starts.</text>
<rect x="1020" y="2035" width="26" height="26" rx="4" fill="none" stroke="#e6edf3" stroke-width="3"/>
<text x="1062.0" y="2056.0" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="700">5. Coil A first try: A+ BLK, A− GRN. Coil B: B+ RED, B− BLU.</text>
<text x="1082.0" y="2080.0" font-size="16" fill="#9198a1" text-anchor="start" font-weight="400">Fault 7, runaway or hunting at the first move: swap A+ and A− only.</text>
<rect x="1020" y="2099" width="26" height="26" rx="4" fill="none" stroke="#e6edf3" stroke-width="3"/>
<text x="1062.0" y="2120.0" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="700">6. Encoder: EB+ YEL, EB− GRN, EA+ BLK, EA− BLU, VCC RED, EGND WHT.</text>
<text x="1082.0" y="2144.0" font-size="16" fill="#9198a1" text-anchor="start" font-weight="400">Same in the vendor article and the E1000 sheet; check the E1K cable label.</text>
<rect x="1020" y="2163" width="26" height="26" rx="4" fill="none" stroke="#e6edf3" stroke-width="3"/>
<text x="1062.0" y="2184.0" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="700">7. Power on: green LED on, red LED off.</text>
<text x="1082.0" y="2208.0" font-size="16" fill="#9198a1" text-anchor="start" font-weight="400">froggy-motor status says ALM: ok and PEND: not wired.</text>
<rect x="1020" y="2227" width="26" height="26" rx="4" fill="none" stroke="#e6edf3" stroke-width="3"/>
<text x="1062.0" y="2248.0" font-size="19" fill="#e6edf3" text-anchor="start" font-weight="700">8. cl-test --rpm 60 ends with alarms none and ALM ok.</text>
<text x="1082.0" y="2272.0" font-size="16" fill="#9198a1" text-anchor="start" font-weight="400">Speed is unmeasured (no hall): watch the tape flag turn at 1 rev/s.</text>
